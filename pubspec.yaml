name: countup
description: "CountUp - finite goal counter app"
publish_to: 'none'
version: 1.0.0+3
environment:
  sdk: ^3.11.4
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management
  flutter_riverpod: ^2.5.1
  # Routing
  go_router: ^14.2.7
  # Local DB (Hive)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0

  # 스플래시 화면 설정
  flutter_native_splash: ^2.3.13

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icons/splash12.png"
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: "assets/icons/splash12.png"
  fullscreen: false
  android_gravity: center
  ios_content_mode: center
  web: false
  # Optional UX effects (uncomment if needed)
  # confetti: ^0.7.0
  # flutter_animate: ^4.5.0
  # lottie: ^3.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/icon.png"
  min_sdk_android: 21


flutter:
  uses-material-design: true
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
  
  assets:
    - assets/icons/